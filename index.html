<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arabic Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Karla:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
/* Layout: a four-stop timeline selects one topic panel; long content folds into dropdowns; English or Urdu sets the page direction. */
:root {
  --bg: #eef2f4;
  --surface: #fbfcfd;
  --ink: #17252e;
  --soft: #51636f;
  --line: #cbd6dc;
  --accent: #174f8a;
  --on-accent: #ffffff;
  --accent-bg: #dce9f5;
  --arabic: "Amiri", "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif;
  --latin: "Karla", "Segoe UI", system-ui, sans-serif;
  --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11191f; --surface: #18232b; --ink: #e9eff2; --soft: #a3b3bd;
    --line: #31424e; --accent: #8cc0f2; --on-accent: #10202c; --accent-bg: #1c3550; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11191f; --surface: #18232b; --ink: #e9eff2; --soft: #a3b3bd;
  --line: #31424e; --accent: #8cc0f2; --on-accent: #10202c; --accent-bg: #1c3550; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--latin);
  font-size: 1rem;
  line-height: 1.5;
}
.page {
  max-width: 68rem;
  margin: 0 auto;
  padding-block: 1.5rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 1.25rem;
}
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem; }
h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.top-actions { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.lang button { font: inherit; font-size: 0.9rem; color: var(--ink); background: none; border: 0; padding: 0.3rem 0.8rem; cursor: pointer; }
.lang button[lang="ur"] { font-family: var(--urdu); line-height: 2; font-size: 0.85rem; padding-block: 0; }
.lang button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.timeline::before { content: ""; position: absolute; top: 1.25rem; left: 10%; right: 10%; height: 2px; background: var(--line); }
.timeline li { min-width: 0; position: relative; }
.stop { width: 100%; height: 100%; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 6px; padding: 0.25rem 0.25rem 0.5rem; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 0.3rem; text-align: center; }
.stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--latin); line-height: 1; font-size: 0.9rem; font-weight: 700; background: var(--bg); border: 2px dashed var(--line); color: var(--soft); }
.stop.ready .dot { border: 2px solid var(--accent); color: var(--accent); }
.stop[aria-current="true"] .dot { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.stop:hover .dot { border-color: var(--accent); }
.stop-name { font-size: 0.82rem; font-weight: 500; line-height: 1.25; }
.stop[aria-current="true"] .stop-name { font-weight: 700; color: var(--accent); }
.stop-state { font-size: 0.75rem; color: var(--soft); line-height: 1.2; }

.panel { display: grid; gap: 1rem; padding-top: 1.25rem; border-top: 1px solid var(--line); min-width: 0; }
.panel h2 { margin: 0; font-size: 1.3rem; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.sub { margin: 0.2rem 0 0; max-width: 65ch; color: var(--soft); }
.soon { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 2rem 1rem; text-align: center; font-weight: 500; color: var(--soft); }

.picker { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.picker button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; }
.picker button:hover { border-color: var(--accent); }
.picker button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.word { font-family: var(--arabic); font-size: 1.3rem; line-height: 1.4; font-weight: 400; }

.context-head { text-align: center; margin-top: 2rem; }
.context-note { margin: 0.1rem 0 0; font-size: 1.1rem; font-weight: 500; }
.context-head .sub { margin-inline: auto; }
.picker-center { justify-content: center; }
.alif-list { display: grid; gap: 0.5rem; }
.alif-verb { border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.alif-name { padding: 0.35rem 0.65rem; font-weight: 700; border-bottom: 1px solid var(--line); }
.alif-forms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.alif-form { display: grid; align-content: start; gap: 0.1rem; padding: 0.5rem 0.65rem; min-width: 0; border-inline-end: 1px solid var(--line); }
.alif-form:last-child { border-inline-end: 0; }
.alif-form .mini { display: block; text-align: center; }
.alif-form .translit, .alif-form .cell-label { text-align: center; }
.lesson, .fold-list { display: grid; gap: 0.75rem; min-width: 0; }
.callout { display: grid; gap: 0.5rem; padding: 0.85rem; background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 6px; min-width: 0; }
.callout h3 { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--accent); }
.callout p { margin: 0; max-width: 65ch; }
.callout .ex-list li { background: var(--surface); }
.lesson-text { margin: 0; max-width: 65ch; }
.sec-head { margin: 0.5rem 0 0; font-size: 1.15rem; font-weight: 700; }
.source { margin: 0; font-size: 0.8rem; color: var(--soft); }
.sum-ar { font-family: var(--arabic); font-size: 1.35rem; font-weight: 400; }
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.5rem; }
.ex-list li { border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0.7rem; min-width: 0; }
.ex-list .mini, .word-table .mini { display: block; }
.ex-list .translit { display: block; }
.word-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
.word-table th, .word-table td { padding: 0.45rem 0.65rem; text-align: start; vertical-align: middle; border-bottom: 1px solid var(--line); border-inline-end: 1px solid var(--line); overflow-wrap: anywhere; }
.word-table tr:last-child td { border-bottom: 0; }
.word-table th:last-child, .word-table td:last-child { border-inline-end: 0; }
.word-table th { font-weight: 700; font-size: 0.9rem; }
.word-table.three td:first-child { font-size: 0.9rem; font-weight: 500; }
.dash { color: var(--soft); font-size: 0.85rem; }
.gen-list { margin: 0; padding-inline-start: 1.25rem; display: grid; gap: 0.3rem; max-width: 65ch; }
.reading { display: grid; gap: 0.5rem; padding: 0.85rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.reading .sec-head { margin: 0; }
.reading-ar { margin: 0; font-family: var(--arabic); font-size: 1.5rem; line-height: 2.1; text-align: right; }
.reading details { background: none; }
.group-head { margin: 0; font-size: 1.75rem; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.table-wide { display: none; }
.table-narrow { display: grid; gap: 0.5rem; }
.person { margin: 0; font-size: 1.02rem; font-weight: 700; }
.person small { display: block; font-size: 0.85rem; font-weight: 400; color: var(--soft); }
.row-label { font-weight: 500; font-size: 0.92rem; }
.cell { background: var(--surface); min-width: 0; padding: 0.6rem 0.85rem; display: grid; gap: 0.1rem; align-content: center; }
.cell-label { font-size: 0.8rem; color: var(--soft); }
.arabic { font-family: var(--arabic); font-size: 1.7rem; line-height: 1.7; direction: rtl; text-align: right; }
.end { color: var(--accent); }
.meaning { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.6rem; font-size: 0.9rem; color: var(--soft); }
.meaning b { color: var(--ink); font-weight: 500; }
.chip { font-family: var(--arabic); font-size: 1.05rem; line-height: 1.5; direction: rtl; color: var(--accent); background: var(--accent-bg); border-radius: 4px; padding: 0 0.45rem; white-space: nowrap; }
.saudi-note { margin-top: 0.4rem; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 0.5rem; padding: 0.3rem 0.55rem; background: var(--accent-bg); border-radius: 4px; color: var(--accent); }
.saudi-tag { font-size: 0.75rem; font-weight: 700; grid-row: span 2; }
.saudi-note .mini { font-size: 1.2rem; text-align: right; line-height: 1.5; }
.saudi-note .translit { color: var(--accent); text-align: right; font-size: 0.8rem; }
.note { margin: 0; max-width: 65ch; font-size: 0.9rem; color: var(--soft); }
.lat { font-family: var(--latin); }
.inline-ar { font-family: var(--arabic); font-size: 1.15em; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
summary { list-style: none; cursor: pointer; padding-block: 0.7rem; padding-inline: 0.85rem 2.5rem; position: relative; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; position: absolute; inset-inline-end: 1rem; top: 50%; width: 0.55rem; height: 0.55rem; margin-top: -0.4rem; border-right: 2px solid var(--soft); border-bottom: 2px solid var(--soft); transform: rotate(45deg); }
details[open] > summary::after { transform: rotate(225deg); margin-top: -0.1rem; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.sum-title { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
.sum-sub { display: block; font-size: 0.875rem; color: var(--soft); line-height: 1.35; }
.fold { display: grid; gap: 0.75rem; padding: 0 0.85rem 0.85rem; min-width: 0; }
.table-narrow .fold { gap: 0; padding: 0; }
.table-narrow .cell { border-top: 1px solid var(--line); background: none; }
.fold p { margin: 0; }
.fold h4 { margin: 0; font-size: 1rem; font-weight: 700; }
.topics { display: grid; gap: 1rem; }
.topic { display: grid; gap: 0.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); min-width: 0; }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.5rem; }
.pair { display: grid; gap: 0.1rem; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.pair .mini { display: block; text-align: right; }

.stop-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
.stop-table { width: 100%; border-collapse: collapse; }
.stop-table th, .stop-table td { padding: 0.45rem 0.65rem; text-align: start; vertical-align: middle; border-bottom: 1px solid var(--line); }
.stop-table tr:last-child td { border-bottom: 0; }
.stop-table th { font-size: 0.85rem; font-weight: 700; }
.stop-table td:first-child { font-size: 0.9rem; font-weight: 500; }
.mini { font-family: var(--arabic); font-size: 1.4rem; line-height: 1.6; direction: rtl; }
.translit { display: block; font-size: 0.85rem; color: var(--soft); }
.items { list-style: none; margin: 0; padding: 0; display: grid; }
.items li { display: grid; gap: 0.35rem; min-width: 0; }
.items h3 { margin: 0; font-size: 1rem; font-weight: 700; }
.items p { color: var(--soft); max-width: 65ch; }
.ex .mini { display: block; text-align: right; }
.ex .translit { text-align: right; }
#ex-pronoun { display: grid; gap: 0.6rem; }

/* Nastaliq needs far more vertical room than Latin text. */
.page[lang="ur"] { font-family: var(--urdu); line-height: 2.2; font-size: 0.94rem; }
.page[lang="ur"] h1,
.page[lang="ur"] .panel h2,
.page[lang="ur"] .group-head,
.page[lang="ur"] .sum-title,
.page[lang="ur"] .sum-sub,
.page[lang="ur"] .stop-name,
.page[lang="ur"] .stop-state { line-height: 2.2; }
.page[lang="ur"] .sum-title, .page[lang="ur"] .sum-sub { line-height: 2.1; }
.page[lang="ur"] .stop-name { font-size: 0.8rem; }
.page[lang="ur"] .stop-state { font-size: 0.7rem; }
.page[lang="ur"] h1 { font-size: 1.3rem; }
.page[lang="ur"] .panel h2 { font-size: 1.1rem; }
.page[lang="ur"] .person { font-size: 0.95rem; }
.page[lang="ur"] #theme-group button { font-family: var(--urdu); line-height: 2; font-size: 0.85rem; padding-block: 0; }
.page[lang="ur"] .callout h3 { font-size: 1rem; line-height: 2.2; }
.page[lang="ur"] .sec-head { font-size: 1.05rem; line-height: 2.2; }
.page[lang="ur"] .source { font-size: 0.75rem; }
.page[lang="ur"] .lat { line-height: 1.5; }
.page[lang="ur"] .group-head { font-size: 1.45rem; }
.page[lang="ur"] .sum-title { font-size: 1.05rem; }
.page[lang="ur"] .context-note { font-size: 0.95rem; line-height: 2.2; }
.page[lang="ur"] .note, .page[lang="ur"] .meaning, .page[lang="ur"] .translit, .page[lang="ur"] .sum-sub { font-size: 0.88rem; }
.page[lang="ur"] .pair, .page[lang="ur"] .cell { gap: 0.5rem; }
.nb { white-space: nowrap; }
.page[lang="ur"] .person small, .page[lang="ur"] .cell-label { font-size: 0.82rem; display: block; line-height: 2.2; }
.page[lang="ur"] .row-label { font-size: 0.85rem; }
.page[lang="ur"] .lat { font-size: 1.1em; }
.page[lang="ur"] .ex .translit, .page[lang="ur"] .pair .translit { text-align: start; }
.page[lang="ur"] .ex .mini { text-align: start; }

@media (min-width: 760px) {
  h1 { font-size: 1.75rem; }
  .stop-name { font-size: 1rem; }
  .page[lang="ur"] .stop-name { font-size: 0.92rem; }
  .table-narrow { display: none; }
  .table-wide { display: grid; grid-template-columns: 7.5rem repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); }
  .table-wide > * { grid-column: var(--c); grid-row: var(--r) / span var(--s, 1); border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
  .table-wide .person, .table-wide .row-label { padding: 0.6rem 0.85rem; }
  .table-wide .row-label { display: flex; align-items: center; }
  .items li { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); column-gap: 2rem; align-items: center; }
  .items .ex { grid-column: 2; grid-row: 1 / span 2; }
}
</style>
</head>
<body>

<main class="page" id="page" lang="en" dir="ltr">
  <div class="top">
    <h1 data-t="siteTitle">Arabic Learning Path</h1>
    <div class="top-actions"><div class="lang" role="group" id="theme-group" aria-label="Theme">
      <button type="button" id="theme-light" aria-pressed="false"></button>
      <button type="button" id="theme-dark" aria-pressed="false"></button>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" lang="en" dir="ltr" aria-pressed="true">English</button>
      <button type="button" id="lang-ur" lang="ur" dir="rtl" aria-pressed="false">اردو</button>
    </div></div>
  </div>
  <nav data-aria="topicsLabel"><ol class="timeline" id="timeline"></ol></nav>

  <section class="panel" id="panel-demonstratives" hidden><div><h2 id="demo-title"></h2><p class="sub" id="demo-sub"></p></div><div class="lesson" id="demo-body"></div></section>
  <section class="panel" id="panel-questions" hidden><div><h2 id="q-title"></h2><p class="sub" id="q-sub"></p></div><div class="lesson" id="q-body"></div></section>
  <section class="panel" id="panel-pronouns" hidden><div><h2 id="pron-title"></h2><p class="sub" id="pron-sub"></p></div><div class="lesson" id="pron-body"></div></section>
  <section class="panel" id="panel-gender" hidden><div><h2 id="gen-title"></h2><p class="sub" id="gen-sub"></p></div><div class="lesson" id="gen-body"></div></section>

  <section class="panel" id="panel-past-tense" hidden>
    <div>
      <h2 data-t="pastTitle"></h2>
      <p class="sub" data-t="pastSub"></p>
    </div>
    <div class="picker" id="picker" role="group"></div>
    <div class="table-wide" id="table-wide"></div>
    <div class="table-narrow" id="table-narrow"></div>
    <p class="note" data-t="verbPrompt"></p>

    <div class="context-head">
      <h3 class="group-head" data-t="contextHead"></h3>
      <p class="context-note" data-t="contextNote"></p>
      <p class="sub" data-t="contextSub"></p>
    </div>
    <div class="picker picker-center" id="picker-context" role="group"></div>


    <details id="fold-dropped">
      <summary><span class="sum-title" data-t="droppedTitle"></span><span class="sum-sub" data-t="droppedSub"></span></summary>
      <div class="fold">
        <ul class="items">
          <li><p data-t="dPronounP"></p><div class="ex" id="ex-pronoun"></div></li>
        </ul>
      </div>
    </details>

    <details id="fold-alif">
      <summary><span class="sum-title" data-t="alifVerbsTitle"></span><span class="sum-sub" data-t="alifVerbsSub"></span></summary>
      <div class="fold">
        <div class="alif-list" id="alif-verbs"></div>
        <p class="note" data-t="alifVerbsNote"></p>
      </div>
    </details>
  </section>
</main>

<script>
const lat = text => `<bdi class="lat" dir="ltr">${text}</bdi>`;
const ar = text => `<bdi class="inline-ar" lang="ar" dir="rtl">${text}</bdi>`;

const T = {
  en: {
    siteTitle: 'Arabic Learning Path',
    light: 'Light',
    dark: 'Dark',
    themeLabel: 'Theme',
    topicsLabel: 'Topics',
    comingSoon: 'Coming soon',
    ready: 'Ready',
    pastTitle: 'Past tense table',
    pastSub: 'Pick a verb. The colored ending shows who did the action.',
    pickVerb: 'Choose a verb',
    contextHead: "Teacher's remarks",
    contextNote: '(all points made in class)',
    saudiLabel: 'Saudi',
    verbPrompt: 'Select the verbs and see how they sound and change in first, second, and third person reference.',
    contextSub: 'Pick a verb to update the examples below.',
    sukoonTitle: 'When a vowel becomes sukoon',
    sukoonSub: 'How endings sound when you stop after a word',
    allEndings: 'All the endings at a stop',
    stopRule: 'When you stop after a word, you usually drop its short last vowel. In the middle of a sentence, the vowel stays.',
    colMeaning: 'Meaning',
    colFull: 'Full form',
    colStop: 'At a stop',
    noChange: `These stay the same because they already end in sukoon or a long vowel: ${lat('-tum, -at, -naa, -uu')}.`,
    droppedTitle: 'The pronoun is inside the verb',
    droppedSub: 'The ending already says I, you, he, or she',
    dPronounP: `The ending already shows who did the action, so ${ar('أَنَا')} and ${ar('هُوَ')} are usually left out. Keep them for emphasis.`,
    alifVerbsTitle: 'Verbs with alif',
    alifVerbsSub: 'When the alif drops and when it comes back',
    alifVerbsNote: `Slept and came lose the middle alif in first and second person, then get it back in third person. It also drops for they (female): ${ar('نِمْنَ')}, ${ar('جِئْنَ')}. Ate keeps its alif because it is the first letter, not a middle alif.`,
    whyH: 'Why I and you (male) can sound the same',
    whyP: 'When you stop on a word in Arabic, you usually don\'t say its short last vowel. The damma in the I form and the fatha in the you form both drop, so ت gets a sukoon in both. The you (female) form usually does the same.',
    whyNote: 'The sentence usually shows who is meant. If it doesn\'t, speakers often keep the vowel.',
    alifH: 'The alif in first person',
    alifP: `The alif in ${ar('أَنَا')} is always written. In formal Arabic, it usually sounds short in the middle of a sentence and long when you stop on the word. The alif in ${ar('نَا')} stays long in formal Arabic, even at a stop, but many dialects shorten it.`,
    anaLabel: `${ar('أَنَا')}, in the middle of a sentence`,
    naLabel: `${ar('نَا')}, formal and dialect`,
    becomes: (a, b) => `${lat(a)} becomes ${lat(b)}`,
    naText: (a, b) => `${lat(a)}, often ${lat(b)} in dialect`,
    rows: ['Male', 'Female', 'Group: male or mixed', 'Group: female'],
    group: 'Group',
    persons: [['First person', 'I, we'], ['Second person', 'you'], ['Third person', 'he, she, they']],
    topics: {
      demonstratives: ['This, that, these, those', 'Words for pointing at people and things.'],
      questions: ['Questions', ''],
      pronouns: ['Pronouns', 'He, she, it, they, we, our, her, him, theirs, and the rest.'],
      gender: ['Male and female words', 'How to tell male and female words apart.'],

  const topic = topics.find(x => x.id === id) || topics[0];

const SAUDI_STEM = {
  dhahab: { ar: 'رَاح', t: 'raah', short: { ar: 'رُح', t: 'ruh' } },
  naam: { ar: 'نَام', t: 'naam', short: { ar: 'نِم', t: 'nim' } }

function saudiNote(v, x) {
  const d = SAUDI[x.k];
  if (!d) return '';
  const base = SAUDI_STEM[v.t] || { ar: v.ar, t: v.t };
  const st = d[3] && base.short ? base.short : base;
  return `<div class="saudi-note"><span class="saudi-tag">${t().saudiLabel}</span><span class="mini" lang="ar">${d[0]} ${st.ar}<span class="end">${d[1]}</span></span><span class="translit">${lat(st.t + d[2])}</span></div>`;
}
function cellHtml(x, v, c, withLabel) {
  const st = stem(v, x);
  const chip = /^[َُ]/.test(x.e) ? 'ـ' + x.e : x.e;
  return `<div class="cell" style="--c:${c};--r:${x.r};--s:${x.span || 1}">
    ${withLabel ? `<span class="cell-label">${rowLabel(x)}</span>` : ''}
    <div class="arabic" lang="ar">${x.p} ${st.ar}${x.s}<span class="end">${x.e}</span></div>
    <div class="meaning"><span>${lat(`<b>${st.t}${x.te}</b>`)} · ${meaning(v, x)}</span><span class="chip" lang="ar">+ ${chip}</span></div>
    ${saudiNote(v, x)}
  </div>`;
}

    a: 'أَنَا طَالِب، وَأَنْتَ مُدَرِّس. أَنْتِ دُكْتُورَة، وَأَنْتُمْ أَصْدِقَاء. هُوَ مُهَنْدِس، وَهِيَ مُدَرِّسَة. هُمْ طُلَّاب، وَحِنَّا طُلَّاب. هَذَا كِتَابِي، وَهَذَا كِتَابْنَا. هَذَا مِفْتَاحَه، وَهَذَا مِفْتَاحْهَا، وَهَذَا مِفْتَاحْهُم.',
    t: "Ana taalib, wa anta mudarris. Anti duktoorah, wa antum asdiqaa'. Huwa muhandis, wa hiya mudarrisah. Hum tullaab, wa hinna tullaab. Haadha kitaabi, wa haadha kitaabna. Haadha miftaahah, wa haadha miftaahha, wa haadha miftaahhum.",
    en: 'I am a student, and you are a teacher. You are a doctor, and you all are friends. He is an engineer, and she is a teacher. They are students, and we are students. This is my book, and this is our book. This is his key, this is her key, and this is their key.',
    ur: 'میں طالب علم ہوں، اور تم استاد ہو۔ تم ڈاکٹر ہو، اور تم سب دوست ہو۔ وہ انجینئر ہے، اور وہ استانی ہے۔ وہ طلبہ ہیں، اور ہم طلبہ ہیں۔ یہ میری کتاب ہے، اور یہ ہماری کتاب ہے۔ یہ اس (مذکر) کی چابی ہے، یہ اس (مؤنث) کی چابی ہے، اور یہ ان کی چابی ہے۔'
  }
};
const GEN = {
  people: [[W('طَالِب', 'taalib', 'student', 'طالب علم'), W('طَالِبَة', 'taalibah', 'student', 'طالبہ')], [W('مُدَرِّس', 'mudarris', 'teacher', 'استاد'), W('مُدَرِّسَة', 'mudarrisah', 'teacher', 'استانی')], [W('مُهَنْدِس', 'muhandis', 'engineer', 'انجینئر'), W('مُهَنْدِسَة', 'muhandisah', 'engineer', 'انجینئر')], [W('دُكْتُور', 'duktoor', 'doctor', 'ڈاکٹر'), W('دُكْتُورَة', 'duktoorah', 'doctor', 'ڈاکٹر')], [W('مُوَظَّف', 'muwazzaf', 'employee', 'ملازم'), W('مُوَظَّفَة', 'muwazzafah', 'employee', 'ملازمہ')]],
  groups: [[W('طُلَّاب', 'tullaab', 'students', 'طلبہ'), W('طَالِبَات', 'taalibaat', 'students', 'طالبات')], [W('مُهَنْدِسِين', 'muhandisiin', 'engineers', 'انجینئر'), W('مُهَنْدِسَات', 'muhandisaat', 'engineers', 'انجینئر')], [W('أَصْدِقَاء', "asdiqaa'", 'friends', 'دوست'), W('صَدِيقَات', 'sadeeqaat', 'friends', 'سہیلیاں')], [W('مُدَرِّسِين', 'mudarrisiin', 'teachers', 'اساتذہ'), null], [W('دَكَاتِرَة', 'dakaatirah', 'doctors', 'ڈاکٹر'), null]],
  names: [[W('أَحْمَد', 'ahmad', 'Ahmad', 'احمد'), W('فَاطِمَة', 'faatimah', 'Fatimah', 'فاطمہ')], [W('خَالِد', 'khaalid', 'Khalid', 'خالد'), W('مَرْيَم', 'maryam', 'Maryam', 'مریم')]],
  things: [[W('كِتَاب', 'kitaab', 'book', 'کتاب'), W('سَيَّارَة', 'sayyaarah', 'car', 'گاڑی')], [W('قَلَم', 'qalam', 'pen', 'قلم'), W('شَنْطَة', 'shantah', 'bag', 'بیگ')], [W('جَوَّال', 'jawwaal', 'phone', 'فون'), W('حَقِيبَة', 'haqeebah', 'bag', 'بیگ')], [W('مَسْجِد', 'masjid', 'mosque', 'مسجد'), W('مَدْرَسَة', 'madrasah', 'school', 'اسکول')], [W('دَفْتَر', 'daftar', 'notebook', 'کاپی'), W('غُرْفَة', 'ghurfah', 'room', 'کمرہ')], [W('كُرْسِي', 'kursi', 'chair', 'کرسی'), W('حَدِيقَة', 'hadeeqah', 'garden', 'باغ')], [W('مَكْتَب', 'maktab', 'desk', 'میز'), W('مِرْوَحَة', 'mirwahah', 'fan', 'پنکھا')], [W('بَاب', 'baab', 'door', 'دروازہ'), W('صُورَة', 'soorah', 'picture', 'تصویر')], [W('بَيْت', 'bayt', 'house', 'گھر'), W('نَظَّارَة', 'nazzaarah', 'glasses', 'عینک')], [W('مِفْتَاح', 'miftaah', 'key', 'چابی'), W('سَاعَة', "saa'ah", 'watch', 'گھڑی')], [W('لَابْتُوب', 'laabtoob', 'laptop', 'لیپ ٹاپ'), null]]
};
const gloss = x => (lang === 'ur' ? x.ur : x.en);
const wordHtml = x => x ? `<span class="mini" lang="ar">${x.a}</span><span class="translit">${lat(x.t)} · ${gloss(x)}</span>` : '<span class="dash">—</span>';
const exList = list => `<ul class="ex-list">${list.map(x => `<li>${wordHtml(x)}</li>`).join('')}</ul>`;
const foldHtml = (id, title, sub, body, open) => `<details id="${id}"><summary><span class="sum-title">${title}</span><span class="sum-sub">${sub}</span></summary><div class="fold">${body}</div></details>`;
const twoCol = (rows, left, right) => `<div class="stop-wrap"><table class="word-table"><thead><tr><th scope="col">${left}</th><th scope="col">${right}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${wordHtml(r[0])}</td><td>${wordHtml(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
const QS = {
  en: { sub: 'Six question words, with three examples each.', ex3: '3 examples', reading: 'Reading exercise', readingSub: 'All the examples together', more: 'Pronunciation and meaning', note: 'مَنْ and إِيش are from your lecture. The other four are common in everyday Saudi Arabic, but they are not in this lecture.' },
  ur: { sub: 'سوال کے چھ الفاظ، ہر ایک کی تین مثالوں کے ساتھ۔', ex3: 'تین مثالیں', reading: 'پڑھنے کی مشق', readingSub: 'تمام مثالیں ایک ساتھ', more: 'تلفظ اور مطلب', note: 'مَنْ اور إِيش آپ کے لیکچر سے ہیں۔ باقی چار روزمرہ سعودی عربی میں عام ہیں، لیکن اس لیکچر میں نہیں۔' }
};
const QUESTIONS = [
  { a: 'مَنْ', en: 'who', ur: 'کون', ex: [W('مَنْ هَذَا؟', 'man haadha?', 'Who is this?', 'یہ کون ہے؟'), W('مَنْ هِيَ؟', 'man hiya?', 'Who is she?', 'وہ کون ہے؟'), W('مَنْ أَنْتَ؟', 'man anta?', 'Who are you?', 'تم کون ہو؟')] },
  { a: 'إِيش', en: 'what', ur: 'کیا', ex: [W('إِيش هَذَا؟', 'eesh haadha?', 'What is this?', 'یہ کیا ہے؟'), W('إِيش هَذِي؟', 'eesh haadhi?', 'What is this?', 'یہ کیا ہے؟'), W('إِيش ذَاك؟', 'eesh dhaak?', 'What is that?', 'وہ کیا ہے؟')] },
  { a: 'لِيش', en: 'why', ur: 'کیوں', ex: [W('لِيش أَنْتَ هِنَا؟', 'leesh anta hina?', 'Why are you here?', 'تم یہاں کیوں ہو؟'), W('لِيش هِيَ فِي الْمَدْرَسَة؟', 'leesh hiya fi l-madrasah?', 'Why is she at school?', 'وہ اسکول میں کیوں ہے؟'), W('لِيش هُمْ فِي الْبَيْت؟', 'leesh hum fi l-bayt?', 'Why are they at home?', 'وہ گھر پر کیوں ہیں؟')] },
  { a: 'وَيْن', en: 'where', ur: 'کہاں', ex: [W('وَيْن الْكِتَاب؟', 'wayn al-kitaab?', 'Where is the book?', 'کتاب کہاں ہے؟'), W('وَيْن السَّيَّارَة؟', 'wayn as-sayyaarah?', 'Where is the car?', 'گاڑی کہاں ہے؟'), W('وَيْن الْمَدْرَسَة؟', 'wayn al-madrasah?', 'Where is the school?', 'اسکول کہاں ہے؟')] },
  { a: 'مَتَى', en: 'when', ur: 'کب', ex: [W('مَتَى الدَّرْس؟', 'mata ad-dars?', 'When is the lesson?', 'سبق کب ہے؟'), W('مَتَى الْمَوْعِد؟', "mata al-maw'id?", 'When is the appointment?', 'ملاقات کب ہے؟'), W('مَتَى الْعُطْلَة؟', "mata al-'utlah?", 'When is the holiday?', 'چھٹی کب ہے؟')] },
  { a: 'كَيْف', en: 'how', ur: 'کیسے', ex: [W('كَيْف حَالَك؟', 'kayf haalak?', 'How are you? (to a male)', 'تم کیسے ہو؟'), W('كَيْف حَالِك؟', 'kayf haalik?', 'How are you? (to a female)', 'تم کیسی ہو؟'), W('كَيْف الْمَدْرَسَة؟', 'kayf al-madrasah?', 'How is the school?', 'اسکول کیسا ہے؟')] }
];
function renderQuestions() {
  const Q = QS[lang];
  const all = QUESTIONS.flatMap(q => q.ex);
  $('q-title').textContent = t().topics.questions[0];
  $('q-sub').textContent = Q.sub;
  $('q-body').innerHTML = `<div class="fold-list">${QUESTIONS.map((q, i) => foldHtml('q-' + i, `<span class="sum-ar" lang="ar">${q.a}</span> <span>${gloss(q)}</span>`, Q.ex3, exList(q.ex), i === 0)).join('')}</div>
    <section class="reading"><h3 class="sec-head">${Q.reading}</h3><p class="note">${Q.readingSub}</p><p class="reading-ar" lang="ar" dir="rtl">${all.map(x => x.a).join(' ')}</p>
    ${foldHtml('q-reading', Q.more, '', `<p class="note" dir="ltr" lang="en" style="font-family:var(--latin)">${all.map(x => x.t).join(' ')}</p><p class="note">${all.map(gloss).join(' ')}</p>`, false)}</section>
    <p class="note">${Q.note}</p>`;
}

function renderLessons() {
  const S = LS[lang];
  $('demo-body').innerHTML = `<p class="lesson-text">${S.demoIntro}</p>
    <div class="stop-wrap"><table class="word-table three"><thead><tr><th scope="col">${S.tableWord}</th><th scope="col">${S.near}</th><th scope="col">${S.far}</th></tr></thead><tbody>${DEMO.matrix.map((r, i) => `<tr><td>${S.rows[i]}</td><td><span class="mini" lang="ar">${r[0]}</span></td><td>${r[1] ? `<span class="mini" lang="ar">${r[1]}</span>` : `<span class="dash">${S.notCovered}</span>`}</td></tr>`).join('')}</tbody></table></div>
    <div class="callout"><h3>${S.pointH}</h3><p>${S.pointP}</p>${exList(DEMO.these.slice(0, 3))}</div>
    <p class="note">${S.thoseNote}</p>
    ${foldHtml('demo-this', S.thisT, S.thisS, `<p class="note">${S.thisP}</p>${exList(DEMO.this)}`, true)}
    ${foldHtml('demo-these', S.theseT, S.theseS, `<p class="note">${S.theseP}</p>${exList(DEMO.these)}`, false)}
    ${foldHtml('demo-that', S.thatT, S.thatS, `<p class="note">${S.thatP}</p>${exList(DEMO.that)}`, false)}
    ${foldHtml('demo-ask', S.askT, S.askS, `<p class="note">${S.askP}</p>${exList(DEMO.ask)}`, false)}
    <p class="source">${S.source}</p>`;
  const pronFold = (p, id) => foldHtml(id, `<span class="sum-ar" lang="ar">${p.a}</span> <span>${gloss(p)}</span>`, p.sub ? p.sub[lang] : (lang === 'ur' ? 'تین مثالیں' : '3 examples'), exList(p.ex), false);
  $('pron-body').innerHTML = `<h3 class="sec-head">${S.pronGroup1}</h3><div class="fold-list">${PRON.people.map((p, i) => pronFold(p, 'pron-p' + i)).join('')}</div>
    <h3 class="sec-head">${S.pronGroup2}</h3><p class="note">${S.pronEndNote}</p><div class="fold-list">${PRON.endings.map((p, i) => pronFold(p, 'pron-e' + i)).join('')}</div>
    <section class="reading"><h3 class="sec-head">${S.reading}</h3><p class="note">${S.readingSub}</p><p class="reading-ar" lang="ar" dir="rtl">${PRON.reading.a}</p>
    ${foldHtml('pron-reading', S.readingMore, '', `<p class="note" dir="ltr" lang="en" style="font-family:var(--latin)">${PRON.reading.t}</p><p class="note">${gloss(PRON.reading)}</p>`, false)}</section>
    <p class="source">${S.source}</p>`;
  $('gen-body').innerHTML = `<h3 class="sec-head">${S.genH}</h3><ul class="gen-list">${S.genList.map(x => `<li>${x}</li>`).join('')}</ul>

    ${foldHtml('gen-things', S.tThings, S.tThingsS, twoCol(GEN.things, S.male, S.female), false)}
    ${foldHtml('gen-groups', S.tGroups, S.tGroupsS, twoCol(GEN.groups, S.maleMixed, S.female), false)}
    ${foldHtml('gen-names', S.tNames, S.tNamesS, twoCol(GEN.names, S.male, S.female), false)}
    <p class="source">${S.source}</p>`;
  $('demo-sub').textContent = S.demoSub;
  $('pron-sub').textContent = S.pronSub;
  $('gen-sub').textContent = S.genSub;
  $('demo-title').textContent = t().topics.demonstratives[0];
  $('pron-title').textContent = t().topics.pronouns[0];
  $('gen-title').textContent = t().topics.gender[0];
}

function applyLanguage() {
  const L = t();
  $('alif-verbs').innerHTML = alifHtml();
  const page = $('page');
  page.lang = lang;
  page.dir = lang === 'ur' ? 'rtl' : 'ltr';
  renderLessons();
  paintTheme();
  renderQuestions();
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = L[el.dataset.t]; });
  document.querySelectorAll('[data-aria]').forEach(el => el.setAttribute('aria-label', L[el.dataset.aria]));
  pickers.forEach(([el]) => el.setAttribute('aria-label', L.pickVerb));
  $('lang-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  $('lang-ur').setAttribute('aria-pressed', lang === 'ur' ? 'true' : 'false');
  topics.forEach(topic => {
    const b = $('stop-' + topic.id);
    b.querySelector('.stop-name').textContent = L.topics[topic.id][0];
    b.querySelector('.stop-state').textContent = topic.ready ? L.ready : L.comingSoon;
  });
  draw();
  showTopic(topicId);
}

const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
let theme = null;
try { const saved = localStorage.getItem('arabic-timeline-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch (e) {}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr === 'light' || attr === 'dark') return attr;
  return darkQuery && darkQuery.matches ? 'dark' : 'light';
}
function paintTheme() {
  const L = t();
  const now = currentTheme();
  $('theme-light').textContent = L.light;
  $('theme-dark').textContent = L.dark;
  $('theme-group').setAttribute('aria-label', L.themeLabel);
  $('theme-light').setAttribute('aria-pressed', now === 'light' ? 'true' : 'false');
  $('theme-dark').setAttribute('aria-pressed', now === 'dark' ? 'true' : 'false');
}
function setTheme(next) {
  theme = next;
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('arabic-timeline-theme', next); } catch (e) {}
  paintTheme();
}
if (theme) document.documentElement.setAttribute('data-theme', theme);
$('theme-light').addEventListener('click', () => setTheme('light'));
$('theme-dark').addEventListener('click', () => setTheme('dark'));
if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', paintTheme);

function setLanguage(next) {
  lang = next;
  try { localStorage.setItem('arabic-timeline-lang', next); } catch (e) {}
  applyLanguage();
}
$('lang-en').addEventListener('click', () => setLanguage('en'));
$('lang-ur').addEventListener('click', () => setLanguage('ur'));

topicId = location.hash.slice(1) || 'demonstratives';
applyLanguage();
window.addEventListener('hashchange', () => showTopic(location.hash.slice(1)));
</script>
